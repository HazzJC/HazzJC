      <path d="M-21 -3 Q-23 -15 -10 -16 H10 Q23 -15 21 -3 L18 14 Q16 22 8 15 L1 9 H-1 L-8 15 Q-16 22 -18 14Z" fill="#f4fffb"/>
      <path d="M-12 -5 V7 M-18 1 H-6" stroke="#2a9a6e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="11" cy="-4" r="3" fill="#ed7452"/><circle cx="16" cy="2" r="3" fill="#f6be45"/>
      <text x="0" y="61">Game Night</text>
    </g>
    <g transform="translate(1360 291)">
      <rect x="-37" y="-36" width="74" height="70" rx="13" fill="#238ea8" stroke="#d1faff" stroke-width="3"/>
      <rect x="-21" y="-16" width="42" height="36" rx="5" fill="#f5fcff"/>
      <circle cx="-10" cy="-6" r="6" fill="#ff907c"/><circle cx="10" cy="-6" r="6" fill="#f6d062"/>
      <circle cx="-10" cy="10" r="6" fill="#7dbde8"/><circle cx="10" cy="10" r="6" fill="#8bcf8e"/>
      <text x="0" y="61">Palettes</text>
    </g>
    <g transform="translate(1520 291)">
      <rect x="-37" y="-36" width="74" height="70" rx="13" fill="#4979bb" stroke="#d8e8ff" stroke-width="3"/>
      <path d="M-18 -23 H8 L20 -11 V21 H-18Z" fill="#fffdf4" stroke="#d9e6f8" stroke-width="2"/>
      <path d="M8 -23 V-11 H20" fill="#dae7f8"/>
      <path d="M-9 -7 H1 M-4 -12 V-2" stroke="#ef7462" stroke-width="3" stroke-linecap="round"/>
      <path d="M-9 5 H11 M-9 12 H8" stroke="#7b9cc4" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="61">NHS Papers</text>
    </g>
  </g>

  <!-- Taskbar -->
  <rect y="429" width="1600" height="51" fill="url(#taskbar)"/>
  <path d="M0 430 H1600" stroke="#8abaff" stroke-width="3"/>
  <path d="M0 431 H154 Q167 431 167 449 V463 Q167 480 151 480 H0Z" fill="url(#start)" stroke="#277823" stroke-width="2"/>
